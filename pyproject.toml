[project]
name = "tecmente"
version = "0.1.0"
description = "Pipeline de dados para estudo de análise — e-commerce fictício de informática (TecMente)"
authors = [
    {name = "edsondeveza",email = "edsondeveza@hotmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faker (>=40.11.0,<41.0.0)",
    "pandas (>=3.0.1,<4.0.0)",
    "mysql-connector-python (==8.4.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "plotly (>=6.6.0,<7.0.0)",
    "scikit-learn (>=1.6.0,<2.0.0)",
    "python-dotenv (>=1.0.0)"
]

[project.scripts]
tecmente = "tecmente.tecmente_cli:main"

[tool.poetry]
packages = [{include = "tecmente", from = "src"}]


[tool.poetry.group.dev.dependencies]
ipykernel = "^7.2.0"
pytest = "^8.0.0"
ruff = "^0.8.0"
pytest-cov = ">=5.0.0,<7.0.0"

[tool.ruff]
# Padrão de estilo baseado no ruff format
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# E = erros de estilo, F = erros (simples), I = ordenação de imports
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Catálogo de dados (produtos/endereços): linhas longas são intencionais
# para legibilidade das tabelas em uma linha cada.
"gerador_mestre.py" = ["E501"]
# Exemplos de comandos de agendamento longos no docstring (Windows/cron).
"pipeline.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = "--cov=analise_bi --cov=previsor --cov=tratador --cov=pipeline --cov=tecmente.dados --cov=tecmente.tecmente_cli --cov=gerador_mestre --cov-fail-under=55"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
